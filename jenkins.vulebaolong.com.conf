server {
        listen 80;
        listen [::]:80;
        server_name jenkins.bihouse.win;
        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name jenkins.bihouse.win;

        ssl_certificate /etc/nginx/ssl/bihouse.win-Public.crt;
        ssl_certificate_key /etc/nginx/ssl/bihouse.win-Privite.key;

        location / {
                proxy_pass  http://0.0.0.0:8080;
                include proxy_params;
        }
}
